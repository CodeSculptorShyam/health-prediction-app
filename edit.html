<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 800px;">
        <div class="card-header fw-semibold">Edit Patient #{{ patient.id }}</div>
        <div class="card-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            <form method="POST" action="{{ url_for('edit_patient', patient_id=patient.id) }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="full_name">Full Name</label>
                        <input id="full_name" name="full_name" class="form-control" maxlength="100" value="{{ patient.full_name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="dob">Date of Birth</label>
                        <input id="dob" name="dob" type="text" class="form-control" value="{{ patient.dob }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="email">Email Address</label>
                        <input id="email" name="email" type="text" class="form-control" value="{{ patient.email }}" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="glucose">Glucose</label>
                        <input id="glucose" name="glucose" type="number" step="any" min="0.000001" max="100000" class="form-control" value="{{ patient.glucose }}" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="haemoglobin">Haemoglobin</label>
                        <input id="haemoglobin" name="haemoglobin" type="number" step="any" min="0.000001" max="100000" class="form-control" value="{{ patient.haemoglobin }}" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="cholesterol">Cholesterol</label>
                        <input id="cholesterol" name="cholesterol" type="number" step="any" min="0.000001" max="100000" class="form-control" value="{{ patient.cholesterol }}" required>
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
            <p class="small text-muted mt-3">AI remarks are regenerated when the record is updated.</p>
        </div>
    </div>
</main>
</body>
</html>
